<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReadEase</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px; width: 340px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.4; color: #0f172a; background: #ffffff;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .profiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .btn-profile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      padding: 8px 2px; background: #f8fafc; color: #0f172a; border: 2px solid #94a3b8;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-profile:hover { background: #e2e8f0; }
    .btn-profile[aria-pressed="true"] { background: #1d4ed8; color: #ffffff; border-color: #1e40af; }
    .btn-profile:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    fieldset { border: 2px solid #cbd5e1; border-radius: 8px; padding: 10px; margin: 0 0 10px; }
    legend { font-weight: 700; font-size: 16px; padding: 0 4px; }
    .row { margin-bottom: 8px; }
    .row-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    label { font-size: 16px; font-weight: 600; }
    .val { font-size: 16px; font-weight: 600; color: #334155; }
    select, input[type="range"] {
      width: 100%; font-size: 16px; padding: 4px 6px; border: 2px solid #94a3b8;
      border-radius: 6px; background: #ffffff; color: #0f172a;
    }
    input[type="range"] { padding: 0; cursor: pointer; height: 24px; accent-color: #1d4ed8; }
    .check-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; font-weight: 600; }
    .check-row input { width: 20px; height: 20px; accent-color: #1d4ed8; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .btn-act { font-size: 16px; font-weight: 600; padding: 8px 4px; border: 2px solid #94a3b8; border-radius: 6px; background: #f8fafc; color: #0f172a; cursor: pointer; }
    .btn-act:hover { background: #e2e8f0; }
    .btn-act[aria-pressed="true"] { background: #fee2e2; border-color: #b91c1c; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>ReadEase Accessibility</h1>
  <div class="profiles-grid" role="group" aria-label="Accessibility Profiles">
    <button type="button" class="btn-profile" id="btn-dyslexia" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Dyslexia</span>
    </button>
    <button type="button" class="btn-profile" id="btn-lowvision" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Low Vision</span>
    </button>
    <button type="button" class="btn-profile" id="btn-colorblind" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20Z" fill="currentColor"/></svg>
      <span>Colorblind</span>
    </button>
  </div>

  <fieldset id="cb-section" class="hidden">
    <legend>Color Deficiency</legend>
    <div class="row">
      <label for="cbType">Type</label>
      <select id="cbType">
        <option value="protanopia">Protanopia (Red)</option>
        <option value="deuteranopia">Deuteranopia (Green)</option>
        <option value="tritanopia">Tritanopia (Blue)</option>
      </select>
    </div>
    <div class="row">
      <div class="row-hdr"><label for="cbStrength">Strength</label><span id="cbStrength-val" class="val" aria-hidden="true">100%</span></div>
      <input type="range" id="cbStrength" min="0" max="1" step="0.05" value="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>Fine-tune</legend>
    <div class="row">
      <label for="fontFamily">Font</label>
      <select id="fontFamily">
        <option value="Lexend, system-ui, sans-serif">Lexend / Sans-serif</option>
        <option value="system-ui, sans-serif">System UI</option>
        <option value="Georgia, serif">Serif</option>
        <option value="monospace">Monospace</option>
      </select>
    </div>
    <div class="row"><div class="row-hdr"><label for="zoom">Text Scale</label><span id="zoom-val" class="val" aria-hidden="true">1.0x</span></div><input type="range" id="zoom" min="1" max="2" step="0.05" value="1"></div>
    <div class="row"><div class="row-hdr"><label for="lineHeight">Line Height</label><span id="lineHeight-val" class="val" aria-hidden="true">1.5</span></div><input type="range" id="lineHeight" min="1.2" max="2.2" step="0.1" value="1.5"></div>
    <div class="row"><div class="row-hdr"><label for="letterSpacing">Letter Spacing</label><span id="letterSpacing-val" class="val" aria-hidden="true">0.12em</span></div><input type="range" id="letterSpacing" min="0" max="0.3" step="0.01" value="0.12"></div>
    <div class="row"><div class="row-hdr"><label for="wordSpacing">Word Spacing</label><span id="wordSpacing-val" class="val" aria-hidden="true">0.16em</span></div><input type="range" id="wordSpacing" min="0" max="0.4" step="0.02" value="0.16"></div>
    <div class="row"><div class="row-hdr"><label for="maxWidth">Max Width</label><span id="maxWidth-val" class="val" aria-hidden="true">65ch</span></div><input type="range" id="maxWidth" min="45" max="95" step="5" value="65"></div>
    <div class="row"><div class="row-hdr"><label for="contrast">Contrast</label><span id="contrast-val" class="val" aria-hidden="true">1.0x</span></div><input type="range" id="contrast" min="1" max="2" step="0.1" value="1"></div>
    <div class="row">
      <label for="tint">Page Tint</label>
      <select id="tint">
        <option value="transparent">Default (None)</option>
        <option value="#fbf5e6">Cream (#fbf5e6)</option>
        <option value="#e8f4f8">Soft Blue</option>
        <option value="#fef9c3">Soft Yellow</option>
        <option value="#ffffff">Pure White</option>
        <option value="#18181b">Dark (#18181b)</option>
      </select>
    </div>
    <div class="row">
      <label class="check-row" for="ruler"><input type="checkbox" id="ruler"><span>Reading Ruler</span></label>
    </div>
  </fieldset>

  <div class="actions">
    <button type="button" class="btn-act" id="btn-pause" aria-pressed="false">Pause site</button>
    <button type="button" class="btn-act" id="btn-reset">Reset</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
